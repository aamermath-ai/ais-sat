<!-- ===== AIS scientific calculator: shared by every worksheet (source/build.py adds it before </body>) ===== -->
<style>
.calc-fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:60;display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 20px 0 14px;border:0;border-radius:999px;background:#1c1c1e;color:#fff;font:600 16px/1 Lexend,system-ui,sans-serif;box-shadow:0 12px 30px rgba(0,0,0,.32),inset 0 0 0 1px rgba(255,255,255,.1);cursor:pointer}
.calc-fab i{width:30px;height:30px;border-radius:50%;background:#ff9f0a;display:grid;place-items:center}
.calc-fab svg{width:17px;height:17px}
.calc-fab:hover{background:#2c2c2e}
.calc-fab:focus-visible{outline:3px solid #ff9f0a;outline-offset:3px}
.calc-fab[aria-expanded=true]{display:none}
.calc{position:fixed;z-index:70;right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);width:372px;max-height:calc(100vh - 24px);overflow-y:auto;display:flex;flex-direction:column;
  background:#000;color:#fff;border-radius:42px;padding:12px 16px 18px;box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.09);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;user-select:none;-webkit-user-select:none;scrollbar-width:none;outline:none}
.calc[hidden]{display:none}
.calc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 2px 0 8px}
.calc-top b{font-size:13px;font-weight:600;color:#8e8e93}
.calc-x{width:36px;height:36px;border-radius:50%;border:0;background:#2c2c2e;color:#fff;font-size:17px;line-height:1;cursor:pointer;display:grid;place-items:center}
.calc-x:focus-visible,.calc .k:focus-visible{outline:3px solid #ff9f0a;outline-offset:2px}
.calc-disp{padding:6px 8px 10px;text-align:right;min-height:112px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.calc-mode{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.04em;color:#ff9f0a;background:rgba(255,159,10,.15);padding:3px 9px;border-radius:999px;white-space:pre}
.calc-expr{font-size:20px;color:#8e8e93;white-space:nowrap;overflow-x:auto;scrollbar-width:none;min-height:26px}
.calc-expr::-webkit-scrollbar{display:none}
.calc-res{font-size:56px;font-weight:300;line-height:1.08;white-space:nowrap;overflow:hidden;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.calc-sci{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:12px}
.calc-std{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.calc .k{border:0;border-radius:999px;color:#fff;cursor:pointer;font-family:inherit;display:grid;place-items:center;padding:0;transition:filter .12s,background-color .12s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.calc-sci .k{height:38px;background:#2a2a2c;font-size:15px}
.calc-std .k{height:54px;background:#333335;font-size:27px}
.calc .k.fn{background:#5c5c5f}
.calc .k.op{background:#ff9f0a;font-size:30px}
.calc .k.on{background:#d4d4d2;color:#000}
.calc .k:hover{filter:brightness(1.25)}
.calc .k:active,.calc .k.hit{filter:brightness(1.7)}
.calc-note{margin:10px 4px 0;font-size:12px;color:#8e8e93;text-align:center}
@media (min-width:1100px){body.calc-open{padding-right:400px}}
@media (max-width:700px){
  .calc{left:0;right:0;bottom:0;top:auto;transform:none;width:auto;max-height:78vh;border-radius:28px 28px 0 0;padding:8px 12px calc(12px + env(safe-area-inset-bottom,0px))}
  .calc-disp{min-height:78px;padding-bottom:6px}.calc-expr{font-size:17px}
  .calc-sci{gap:6px;margin-bottom:8px}.calc-sci .k{height:33px;font-size:13.5px}
  .calc-std{gap:8px}.calc-std .k{height:44px;font-size:22px}.calc .k.op{font-size:25px}
  .calc-note{display:none}
  body.calc-open{padding-bottom:78vh}
}
body{padding-bottom:84px}
@media (prefers-reduced-motion:no-preference){.calc{animation:calcIn .22s ease-out}@keyframes calcIn{from{opacity:0}}}
</style>
<button class="calc-fab" id="calc-fab" type="button" aria-controls="calc" aria-expanded="false"><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3" fill="none" stroke="#fff" stroke-width="2"/><path d="M8 7.5h8M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></i>Calculator</button>
<section class="calc" id="calc" hidden role="dialog" aria-label="Scientific calculator" tabindex="-1">
  <div class="calc-top"><b>Scientific calculator</b><button class="calc-x" id="calc-x" type="button" aria-label="Close calculator">✕</button></div>
  <div class="calc-disp"><span class="calc-mode" id="calc-mode">DEG</span><div class="calc-expr" id="calc-expr"></div><div class="calc-res" id="calc-res" aria-live="polite">0</div></div>
  <div class="calc-sci" id="calc-sci"></div>
  <div class="calc-std" id="calc-std"></div>
  <p class="calc-note">Keyboard works too · 2nd + tan gives tan⁻¹</p>
</section>
<script>
{
"use strict";
const el=id=>document.getElementById(id);
const panel=el("calc"),fab=el("calc-fab"),exprEl=el("calc-expr"),resEl=el("calc-res"),modeEl=el("calc-mode");
let tokens=[],ans=null,justEval=false,err=false,lastExpr="",deg=true,second=false,mem=0,preview="0";
const BIN=["+","−","×","÷","^"],POST=["²","³","⁻¹","!","%"];
const bad=()=>{throw new Error("math");};
const toR=x=>deg?x*Math.PI/180:x, fromR=x=>deg?x*180/Math.PI:x, snap=v=>Math.abs(v)<1e-13?0:v;
const FUNS={
  "sin(":x=>snap(Math.sin(toR(x))),"cos(":x=>snap(Math.cos(toR(x))),
  "tan(":x=>{const r=toR(x);if(Math.abs(Math.cos(r))<1e-12)bad();return snap(Math.tan(r));},
  "sin⁻¹(":x=>(x<-1||x>1)?bad():fromR(Math.asin(x)),"cos⁻¹(":x=>(x<-1||x>1)?bad():fromR(Math.acos(x)),"tan⁻¹(":x=>fromR(Math.atan(x)),
  "sinh(":Math.sinh,"cosh(":Math.cosh,"tanh(":Math.tanh,
  "sinh⁻¹(":Math.asinh,"cosh⁻¹(":x=>x<1?bad():Math.acosh(x),"tanh⁻¹(":x=>(x<=-1||x>=1)?bad():Math.atanh(x),
  "ln(":x=>x<=0?bad():Math.log(x),"log(":x=>x<=0?bad():Math.log10(x),"log₂(":x=>x<=0?bad():Math.log2(x),
  "√(":x=>x<0?bad():Math.sqrt(x),"∛(":Math.cbrt,"e^(":Math.exp,"10^(":x=>Math.pow(10,x),"2^(":x=>Math.pow(2,x)
};
const isFn=t=>typeof t==="string"&&Object.prototype.hasOwnProperty.call(FUNS,t);
const isDigit=t=>typeof t==="string"&&/^[0-9.]$/.test(t);
const isVal=t=>typeof t==="object"&&t!==null;
const last=()=>tokens[tokens.length-1];
const opener=t=>t===undefined||BIN.includes(t)||t==="("||isFn(t);

/* ---- evaluation: lexer + recursive-descent parser (no eval) ---- */
function lex(ts){
  const out=[];let i=0;
  while(i<ts.length){
    const t=ts[i];
    if(isDigit(t)){
      let s="";while(i<ts.length&&isDigit(ts[i]))s+=ts[i++];
      if(ts[i]==="E"){s+="e";i++;if(ts[i]==="−"||ts[i]==="+"){s+=ts[i]==="−"?"-":"+";i++;}let k="";while(i<ts.length&&isDigit(ts[i]))k+=ts[i++];if(!k||k.includes("."))bad();s+=k;}
      const n=Number(s);if(isNaN(n))bad();out.push({t:"n",v:n});continue;
    }
    i++;
    if(isVal(t))out.push({t:"n",v:t.v});
    else if(t==="π")out.push({t:"n",v:Math.PI});
    else if(t==="e")out.push({t:"n",v:Math.E});
    else if(BIN.includes(t))out.push({t:"o",v:t});
    else if(POST.includes(t))out.push({t:"p",v:t});
    else if(isFn(t))out.push({t:"f",v:t});
    else if(t==="("||t===")")out.push({t:t});
    else bad();
  }
  return out;
}
function fact(n){if(n<0||n>170||!Number.isInteger(n))bad();let r=1;for(let k=2;k<=n;k++)r*=k;return r;}
function pw(b,e){
  if(b<0&&!Number.isInteger(e)){const q=1/e,r=Math.round(q);if(Math.abs(q-r)<1e-9&&Math.abs(r)%2===1)return -Math.pow(-b,e);bad();}
  return Math.pow(b,e);
}
function evaluate(ts){
  if(!ts.length)return null;
  const L=lex(ts);let i=0;
  const peek=()=>L[i], starts=x=>x&&(x.t==="n"||x.t==="f"||x.t==="(");
  const isOp=(x,o)=>x&&x.t==="o"&&x.v===o;
  function expr(){let v=term();while(isOp(peek(),"+")||isOp(peek(),"−")){const o=L[i++].v,r=term();v=o==="+"?v+r:v-r;}return v;}
  function term(){let v=unary();for(;;){const p=peek();
      if(isOp(p,"×")||isOp(p,"÷")){i++;const r=unary();if(p.v==="÷"){if(r===0)bad();v=v/r;}else v=v*r;}
      else if(starts(p))v=v*unary();
      else break;}
    return v;}
  function unary(){if(isOp(peek(),"−")){i++;return -unary();}if(isOp(peek(),"+")){i++;return unary();}return power();}
  function power(){const b=post();if(isOp(peek(),"^")){i++;return pw(b,unary());}return b;}
  function post(){let v=prim();while(peek()&&peek().t==="p"){const o=L[i++].v;
      if(o==="²")v=v*v;else if(o==="³")v=v*v*v;else if(o==="⁻¹"){if(v===0)bad();v=1/v;}else if(o==="%")v=v/100;else v=fact(v);}
    return v;}
  function prim(){const p=L[i++];if(!p)bad();
    if(p.t==="n")return p.v;
    if(p.t==="f"){if(!peek()||peek().t===")")bad();const a=expr();if(peek()&&peek().t===")")i++;return FUNS[p.v](a);}
    if(p.t==="("){const a=expr();if(peek()&&peek().t===")")i++;return a;}
    bad();}
  const v=expr();if(i<L.length||!isFinite(v))bad();return v;
}
function fmt(v){
  if(Object.is(v,-0))v=0;const a=Math.abs(v);let s;
  if(a!==0&&(a>=1e12||a<1e-7))s=v.toExponential(9).replace(/\.?0+e/,"e").replace("e+","e").replace("e","E");
  else s=String(parseFloat(v.toPrecision(12)));
  return s.replace("-","−");
}
const disp=t=>isVal(t)?t.d:t;
const depth=()=>tokens.reduce((d,t)=>d+(t==="("||isFn(t)?1:t===")"?-1:0),0);

/* ---- key actions ---- */
function clearAll(){tokens=[];justEval=false;err=false;preview="0";}
function fresh(){if(justEval){tokens=[];justEval=false;err=false;}}
function fromAns(){if(justEval){tokens=err||ans===null?[]:[{d:"Ans",v:ans}];justEval=false;err=false;}}
function op(o){
  fromAns();const L=last();
  if(!tokens.length){if(o==="−")tokens.push("−");else if(ans!==null)tokens.push({d:"Ans",v:ans},o);return;}
  if(L==="E"){if(o==="−")tokens.push("−");return;}
  if(BIN.includes(L)){
    const P=tokens[tokens.length-2];
    if(L==="−"&&(tokens.length===1||opener(P)||P==="E"))return;   // a minus sign belonging to the next number
    if(o==="−"&&L!=="−"){tokens.push("−");return;}
    tokens[tokens.length-1]=o;return;
  }
  if(L==="("||isFn(L)){if(o==="−")tokens.push("−");return;}
  tokens.push(o);
}
function postfix(p){fromAns();if(opener(last())||last()==="E")return;tokens.push(p);}
function fn(f){fresh();tokens.push(f);}
function negate(){
  fromAns();
  let j=tokens.length;while(j>0&&(isDigit(tokens[j-1])||isVal(tokens[j-1])))j--;
  if(j===tokens.length){if(opener(last()))tokens.push("−");return;}
  const p=tokens[j-1];
  if(p==="−"){if(j-1===0||opener(tokens[j-2]))tokens.splice(j-1,1);else tokens[j-1]="+";}
  else if(p==="+")tokens[j-1]="−";
  else tokens.splice(j,0,"−");
}
function equals(){
  if(justEval||!tokens.length)return;
  let v=null;try{v=evaluate(tokens);}catch(e){v=null;}
  for(let n=depth();n>0;n--)tokens.push(")");
  lastExpr=tokens.map(disp).join("")+" =";
  if(v===null){err=true;}else{ans=v;err=false;}
  justEval=true;
}
function cur(){if(justEval)return err?null:ans;try{return evaluate(tokens);}catch(e){return null;}}
const SECOND_KEYS=["ex","ln","sin","cos","tan","sinh","cosh","tanh"];
function press(k){
  if(/^[0-9]$/.test(k)){fresh();tokens.push(k);}
  else switch(k){
    case "dot":{fresh();let j=tokens.length;while(j>0&&isDigit(tokens[j-1]))j--;const run=tokens.slice(j);if(run.includes(".")||tokens[j-1]==="E")break;if(!run.length)tokens.push("0");tokens.push(".");break;}
    case "add":op("+");break;case "sub":op("−");break;case "mul":op("×");break;case "div":op("÷");break;case "xy":op("^");break;
    case "x2":postfix("²");break;case "x3":postfix("³");break;case "inv":postfix("⁻¹");break;case "fact":postfix("!");break;case "pct":postfix("%");break;
    case "yroot":fromAns();if(opener(last()))break;tokens.push("^","(","1","÷");break;
    case "ex":fn(second?"2^(":"e^(");break;case "10x":fn("10^(");break;
    case "sqrt":fn("√(");break;case "cbrt":fn("∛(");break;
    case "ln":fn(second?"log₂(":"ln(");break;case "log":fn("log(");break;
    case "sin":case "cos":case "tan":case "sinh":case "cosh":case "tanh":fn(k+(second?"⁻¹":"")+"(");break;
    case "e":fresh();tokens.push("e");break;case "pi":fresh();tokens.push("π");break;
    case "EE":{if(justEval)break;let j=tokens.length;while(j>0&&isDigit(tokens[j-1]))j--;if(j===tokens.length||tokens[j-1]==="E")break;tokens.push("E");break;}
    case "rand":{fresh();const r=Math.random();tokens.push({d:fmt(+r.toFixed(8)),v:+r.toFixed(8)});break;}
    case "(":fresh();tokens.push("(");break;
    case ")":if(!justEval&&depth()>0&&!opener(last())&&last()!=="E")tokens.push(")");break;
    case "neg":negate();break;
    case "back":if(justEval)clearAll();else tokens.pop();break;
    case "ac":clearAll();break;
    case "eq":equals();break;
    case "2nd":second=!second;break;
    case "rad":deg=!deg;break;
    case "mc":mem=0;break;
    case "m+":{const v=cur();if(v!==null)mem+=v;break;}
    case "m−":{const v=cur();if(v!==null)mem-=v;break;}
    case "mr":fresh();tokens.push({d:fmt(mem),v:mem});break;
  }
  if(second&&SECOND_KEYS.includes(k))second=false;   // like SHIFT: 2nd works for one key
  relabel();update();
}

/* ---- keys and display ---- */
const SCI=[["(","("],[")",")"],["mc","mc"],["m+","m+"],["m−","m−"],["mr","mr"],
  ["2nd","2nd"],["x2","x²"],["x3","x³"],["xy","xʸ"],["ex","eˣ","2ˣ"],["10x","10ˣ"],
  ["inv","1/x"],["sqrt","²√x"],["cbrt","³√x"],["yroot","ʸ√x"],["ln","ln","log₂"],["log","log₁₀"],
  ["fact","x!"],["sin","sin","sin⁻¹"],["cos","cos","cos⁻¹"],["tan","tan","tan⁻¹"],["e","e"],["EE","EE"],
  ["rand","Rand"],["sinh","sinh","sinh⁻¹"],["cosh","cosh","cosh⁻¹"],["tanh","tanh","tanh⁻¹"],["pi","π"],["rad","Rad"]];
const STD=[["back","⌫","fn","Backspace"],["ac","AC","fn","All clear"],["pct","%","fn","Percent"],["div","÷","op","Divide"],
  ["7","7"],["8","8"],["9","9"],["mul","×","op","Multiply"],["4","4"],["5","5"],["6","6"],["sub","−","op","Minus"],
  ["1","1"],["2","2"],["3","3"],["add","+","op","Plus"],["neg","±","","Change sign"],["0","0"],["dot",".","","Decimal point"],["eq","=","op","Equals"]];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
el("calc-sci").innerHTML=SCI.map(([k,l])=>'<button type="button" class="k" data-k="'+esc(k)+'" aria-label="'+esc(l)+'">'+esc(l)+'</button>').join("");
el("calc-std").innerHTML=STD.map(([k,l,c,a])=>'<button type="button" class="k '+(c||"")+'" data-k="'+esc(k)+'" aria-label="'+esc(a||l)+'">'+esc(l)+'</button>').join("");
function relabel(){
  SCI.forEach(([k,l,l2])=>{const b=panel.querySelector('[data-k="'+k+'"]');if(!b)return;
    const t=k==="rad"?(deg?"Rad":"Deg"):(second&&l2?l2:l);if(b.textContent!==t){b.textContent=t;b.setAttribute("aria-label",k==="rad"?"Switch to "+(deg?"radians":"degrees"):t);}});
  panel.querySelector('[data-k="2nd"]').classList.toggle("on",second);
}
function update(){
  exprEl.textContent=justEval?lastExpr:tokens.map(disp).join("");
  exprEl.scrollLeft=exprEl.scrollWidth;
  let big;
  if(justEval)big=err?"Error":fmt(ans);
  else if(!tokens.length)big="0";
  else{try{const v=evaluate(tokens);big=v===null?"0":fmt(v);preview=big;}catch(e){big=preview;}}
  resEl.textContent=big;
  const base=innerWidth<=700?40:56;resEl.style.fontSize=Math.max(22,Math.min(base,base*9/Math.max(9,big.length)))+"px";
  modeEl.textContent=(deg?"DEG":"RAD")+(second?"  ·  2nd":"")+(mem!==0?"  ·  M":"");
}
function flash(k){const b=panel.querySelector('[data-k="'+k+'"]');if(!b)return;b.classList.add("hit");setTimeout(()=>b.classList.remove("hit"),110);}
panel.addEventListener("click",e=>{const b=e.target.closest(".k");if(!b)return;press(b.dataset.k);if(e.detail>0){try{panel.focus({preventScroll:true});}catch(_){}}});   // after a tap, Enter means "=" again
function openCalc(){panel.hidden=false;fab.setAttribute("aria-expanded","true");document.body.classList.add("calc-open");update();try{panel.focus({preventScroll:true});}catch(e){}}
function closeCalc(){panel.hidden=true;fab.setAttribute("aria-expanded","false");document.body.classList.remove("calc-open");try{fab.focus({preventScroll:true});}catch(e){}}
fab.addEventListener("click",openCalc);
el("calc-x").addEventListener("click",closeCalc);
document.querySelectorAll("[data-calc-open]").forEach(b=>b.addEventListener("click",()=>panel.hidden?openCalc():closeCalc()));
const KEYMAP={"+":"add","-":"sub","*":"mul","x":"mul","/":"div","^":"xy",".":"dot",",":"dot","(":"(",")":")","!":"fact","%":"pct","Enter":"eq","=":"eq","Backspace":"back","Delete":"ac","p":"pi","s":"sin","c":"cos","t":"tan"};
document.addEventListener("keydown",e=>{
  if(panel.hidden||e.ctrlKey||e.metaKey||e.altKey)return;
  const tg=e.target,tag=tg&&tg.tagName;
  if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
  if(e.key==="Escape"){e.preventDefault();closeCalc();return;}
  if(e.key==="Enter"&&tag==="BUTTON")return;
  const k=/^[0-9]$/.test(e.key)?e.key:KEYMAP[e.key];
  if(!k)return;
  e.preventDefault();press(k);flash(k);
});
relabel();update();
}
</script>
