<!-- ===== Worksheets AIS: "Send to my teacher" (source/build.py adds this to every worksheet in source/worksheets/) =====
     A worksheet joins in with three small additions (see HANDOVER.md, "Adding a worksheet"):
       1. <div id="ais-report"></div> inside its result box
       2. window.AISWS={id,title,grade,parts,get} once its questions are set up
       3. document.dispatchEvent(new Event("ais-ws-change")) at the end of its score() function -->
<style>
#ais-report{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line,#ccd)}
#ais-report .ar-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#ais-report .ar-send{display:inline-flex;align-items:center;gap:8px}
#ais-report .ar-send svg{width:18px;height:18px;flex:none}
#ais-report .ar-msg{margin:8px 0 0;font-size:14px;color:var(--mut,#667)}
#ais-report .ar-msg.ok{color:var(--green,#1e8e4a);font-weight:600}
#ais-report .ar-msg.err{color:var(--red,#c62e3a)}
#ais-report .ar-fine{margin:6px 0 0;font-size:12.5px;color:var(--mut,#667)}
#ais-report .ar-live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut,#667)}
#ais-report .ar-live i{width:8px;height:8px;border-radius:50%;background:var(--green,#1e8e4a)}
</style>
<script>
(function(){
"use strict";
var URL_="@@STATS_URL@@", W=window.AISWS, box=document.getElementById("ais-report");
if(!W||!box||!URL_)return;
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function devId(){var d=lsGet("ais-dev");if(!d||!/^[a-z0-9]{6,16}$/.test(d)){var A="abcdefghijklmnopqrstuvwxyz0123456789";try{d=Array.from(crypto.getRandomValues(new Uint8Array(12)),function(x){return A[x%36];}).join("");}catch(e){d=(Math.random().toString(36).slice(2)+"000000000000").slice(0,12);}lsSet("ais-dev",d);}return d;}
function today(){var t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");}
var SENT="ais-ws-sent:"+W.id, sending=false, again=false, timer=0, lastBody="";
box.innerHTML='<div class="ar-row"><button type="button" class="ar-send"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Send to my teacher</span></button><span class="ar-live" hidden><i></i>Updates automatically</span></div>'+
  '<p class="ar-msg" aria-live="polite"></p><p class="ar-fine">Sends your name, class and score for this worksheet to your AIS maths teachers.</p>';
var btn=box.querySelector(".ar-send"), msg=box.querySelector(".ar-msg"), live=box.querySelector(".ar-live");
function say(t,c){msg.textContent=t;msg.className="ar-msg"+(c?" "+c:"");}
function payload(){
  var g=W.get(); return {t:"ws",d:devId(),date:today(),ws:W.id,title:W.title,grade:W.grade,name:String(g.name||"").trim(),cls:String(g.cls||"").trim(),
    items:g.items.join(","),parts:Object.keys(W.parts).map(function(k){return k+":"+W.parts[k];}).join("|")};
}
function send(manual){
  var p=payload();
  if(p.name.length<2||!p.cls){if(manual)say("Write your name and class at the top first.","err");return;}
  var body=JSON.stringify(p); if(!manual&&body===lastBody)return;
  if(sending){again=true;return;}
  sending=true; btn.disabled=true; if(manual)say("Sending…");
  fetch(URL_,{method:"POST",headers:{"Content-Type":"text/plain"},body:body}).then(function(r){return r.json();}).then(function(r){
    if(!r||!r.ok)throw new Error(r&&r.error||"no");
    lastBody=body; lsSet(SENT,"1"); live.hidden=false;
    var t=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    say("Sent ✓ "+r.score+" / "+r.total+" at "+t+". Your teacher will see new answers automatically.","ok");
    btn.querySelector("span").textContent="Send again";
  }).catch(function(e){
    say(e&&e.message==="name"?"Write your name and class at the top first.":"Could not send. Check your internet connection and try again.","err");
  }).then(function(){sending=false;btn.disabled=false;if(again){again=false;send(false);}});
}
btn.addEventListener("click",function(){send(true);});
// once a student has sent this worksheet, later answers are sent automatically (a few seconds after each change)
document.addEventListener("ais-ws-change",function(){if(lsGet(SENT)!=="1")return;clearTimeout(timer);timer=setTimeout(function(){send(false);},2500);});
if(lsGet(SENT)==="1"){live.hidden=false;btn.querySelector("span").textContent="Send again";}
})();
</script>
