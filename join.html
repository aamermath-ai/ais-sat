<style>
html,body{margin:0}
[hidden]{display:none!important}
/* ===== Worksheets AIS landing look (teacher.html signed-out screen + join.html) =====
   Bright, friendly, chunky buttons with a solid bottom edge. Light by default; Night/Dark themes get a dark version. */
.lp{--lp-bg:#ffffff;--lp-ink:#2f3640;--lp-mut:#6b7480;--lp-line:#dfe3e8;--lp-card:#ffffff;--lp-soft:#f3f7f6;
  --lp-brand:#12a37f;--lp-brand-d:#0b7a5f;--lp-brand-ink:#ffffff;--lp-red:#e0475b;--lp-gold:#ffc23d;--lp-sky:#e8f6ff;
  min-height:100vh;min-height:100dvh;background:var(--lp-bg);color:var(--lp-ink);font-family:Nunito,"Plus Jakarta Sans",system-ui,sans-serif;
  display:flex;flex-direction:column;overflow-x:clip}
:root[data-theme="night"] .lp,:root[data-theme="dark"] .lp{--lp-bg:#0f1420;--lp-ink:#eef2f8;--lp-mut:#9aa6b8;--lp-line:#2a3346;--lp-card:#171e2d;--lp-soft:#1b2335;--lp-sky:#16233a}
@media (prefers-color-scheme:dark){:root:not([data-theme]) .lp{--lp-bg:#0f1420;--lp-ink:#eef2f8;--lp-mut:#9aa6b8;--lp-line:#2a3346;--lp-card:#171e2d;--lp-soft:#1b2335;--lp-sky:#16233a}}
.lp *{box-sizing:border-box}
.lp-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px clamp(16px,5vw,64px);flex-wrap:wrap}
.lp-logo{display:inline-flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:12px;background:var(--lp-brand);color:#fff;text-decoration:none;
  box-shadow:0 5px 0 var(--lp-brand-d);transform:rotate(-1.5deg)}
.lp-logo img{width:40px;height:40px;border-radius:9px;background:#fff;padding:2px}
.lp-logo span{font:900 clamp(20px,3vw,28px)/1 Nunito,system-ui,sans-serif;letter-spacing:-.01em}
.lp-logo span i{font-style:normal;color:#ffe08a}
.lp-nav{display:flex;gap:12px;flex-wrap:wrap}
.lp-b{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:0 22px;border-radius:10px;cursor:pointer;
  font:800 18px/1 Nunito,system-ui,sans-serif;text-decoration:none;border:2px solid var(--lp-line);background:var(--lp-card);color:var(--lp-ink);
  box-shadow:0 4px 0 var(--lp-line);transition:transform .08s,box-shadow .08s,filter .15s}
.lp-b:hover{filter:brightness(.98)}
.lp-b:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lp-line)}
.lp-b:focus-visible{outline:3px solid var(--lp-brand);outline-offset:3px}
.lp-b svg{width:18px;height:18px;flex:none}
.lp-b.join{color:var(--lp-brand)}
.lp-b.main{min-height:64px;padding:0 40px;font-size:26px;border:0;border-radius:12px;background:var(--lp-brand);color:var(--lp-brand-ink);box-shadow:0 6px 0 var(--lp-brand-d);width:min(440px,100%)}
.lp-b.main:active{box-shadow:0 2px 0 var(--lp-brand-d);transform:translateY(4px)}
.lp-b:disabled{opacity:.55;cursor:wait}
.lp-hero{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);align-items:center;gap:clamp(12px,3vw,40px);padding:clamp(20px,5vh,70px) clamp(16px,4vw,56px)}
.lp-hero svg.ill{width:100%;height:auto;display:block}
.lp-mid{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.lp-mid h1{margin:0;font:800 clamp(32px,4.2vw,54px)/1.12 Nunito,system-ui,sans-serif;letter-spacing:-.01em;color:var(--lp-ink);text-wrap:balance}
.lp-mid p{margin:0;color:var(--lp-mut);font-weight:700;font-size:17px}
.lp-msg{width:min(440px,100%);padding:12px 14px;border-radius:12px;background:var(--lp-soft);font-weight:700;font-size:15px;color:var(--lp-ink);text-align:left}
.lp-msg.err{background:rgba(224,71,91,.12);color:var(--lp-red)}
.lp-msg.ok{background:rgba(18,163,127,.12);color:var(--lp-brand-d)}
:root[data-theme="night"] .lp-msg.ok,:root[data-theme="dark"] .lp-msg.ok{color:#7cf2c0}
.lp-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:10px clamp(16px,5vw,64px) 40px;max-width:1200px;margin:0 auto;width:100%}
.lp-step{background:var(--lp-soft);border-radius:18px;padding:18px 20px;display:flex;gap:14px;align-items:flex-start}
.lp-step b{display:block;font-size:18px;font-weight:800;margin-bottom:2px}
.lp-step span{color:var(--lp-mut);font-weight:600;font-size:15px;line-height:1.45}
.lp-step i{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:900 20px/1 Nunito,sans-serif;font-style:normal;color:#fff;background:var(--lp-brand);box-shadow:0 3px 0 var(--lp-brand-d)}
.lp-step:nth-child(2) i{background:#3d8bfd;box-shadow:0 3px 0 #2a64b8}
.lp-step:nth-child(3) i{background:#f08a24;box-shadow:0 3px 0 #b8640f}
.lp-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px clamp(16px,5vw,64px) 26px;color:var(--lp-mut);font-weight:700;font-size:14px;border-top:1px solid var(--lp-line)}
.lp-foot a{color:inherit}
.lp-theme{display:inline-flex;gap:4px}
.lp-theme button{appearance:none;border:0;background:transparent;color:var(--lp-mut);font:700 13px Nunito,sans-serif;padding:5px 9px;border-radius:8px;cursor:pointer}
.lp-theme button[aria-pressed="true"]{background:var(--lp-soft);color:var(--lp-ink)}
/* join card */
.lp-join{display:flex;flex-direction:column;align-items:center;gap:18px;width:min(460px,100%)}
.lp-code{width:100%;text-align:center;font:900 clamp(30px,8vw,44px)/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.22em;text-transform:uppercase;
  padding:16px 10px 16px calc(10px + .22em);border-radius:14px;border:3px solid var(--lp-line);background:var(--lp-card);color:var(--lp-ink);box-shadow:0 4px 0 var(--lp-line)}
.lp-code:focus{outline:none;border-color:var(--lp-brand);box-shadow:0 4px 0 var(--lp-brand-d)}
.lp-code::placeholder{color:var(--lp-line);letter-spacing:.22em}
.lp-class{width:100%;background:var(--lp-card);border:2px solid var(--lp-line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:6px;text-align:left;box-shadow:0 5px 0 var(--lp-line)}
.lp-class small{font-weight:800;color:var(--lp-brand);letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.lp-class h2{margin:0;font:800 24px/1.2 Nunito,sans-serif}
.lp-class p{margin:0;color:var(--lp-mut);font-weight:700}
@media (max-width:980px){.lp-hero{grid-template-columns:minmax(0,1fr)}.lp-hero .ill-l{order:2;max-width:420px;margin:0 auto}.lp-hero .ill-r{order:3;max-width:420px;margin:0 auto}.lp-steps{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.lp-top{justify-content:center}.lp-b{min-height:44px;padding:0 16px;font-size:16px}.lp-b.main{font-size:22px;min-height:58px}}
@media (prefers-reduced-motion:no-preference){.lp .bob{animation:lpBob 3.2s ease-in-out infinite}.lp .bob.d2{animation-delay:.5s}.lp .bob.d3{animation-delay:1s}
  @keyframes lpBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}}

</style>
</head>

        {code:"10.13",ws:"g12-calc-10-13",title:"Radius and Interval of Convergence of Power Series",sub:"5 questions \u00b7 hints and worked steps",file:"worksheets/g12-calculus-10-13.html"},
        {code:"10.14",ws:"g12-calc-10-14",title:"Finding Taylor or Maclaurin Series for a Function",sub:"5 questions \u00b7 hints and worked steps",file:"worksheets/g12-calculus-10-14.html"},
        {code:"10.15",ws:"g12-calc-10-15",title:"Representing Functions as a Power Series",sub:"5 questions \u00b7 hints and worked steps",file:"worksheets/g12-calculus-10-15.html"}]}]}]}
];

const WS={};GRADES.forEach(g=>g.terms.forEach(t=>t.modules.forEach(m=>m.items.forEach(it=>{if(it.ws)WS[it.ws]=Object.assign({grade:g.id},it);}))));
const Q=new URLSearchParams(location.search), qW=String(Q.get("w")||""), qK=String(Q.get("k")||"").replace(/[^A-Za-z0-9 .\-]/g,"").slice(0,12);
// Ask the school server (Google Apps Script). It is sometimes slow to wake up, and some phones or
// school networks drop the first request, so each lookup is tried 3 times with a time limit.
async function getJSON(url){
  let last;
  for(let i=0;i<3;i++){
    const ctl="AbortController" in window?new AbortController():null, t=setTimeout(()=>ctl&&ctl.abort(),15000);
    try{
      const res=await fetch(url+"&_="+Date.now(),{cache:"no-store",redirect:"follow",signal:ctl?ctl.signal:undefined});
      const txt=await res.text();
      try{return JSON.parse(txt);}catch(x){last=new Error("server");}   // Google sent an error page, not data
    }catch(x){last=x;}
    finally{clearTimeout(t);}
    if(i<2){msg(i?"Still trying… the school server is slow to answer.":"Connecting to the school server…");await new Promise(r=>setTimeout(r,1200*(i+1)));}
  }
  throw last||new Error("net");
}
function show(r){
  msg("");$("j-help").hidden=true;
  $("j-form").hidden=true;$("j-found").hidden=false;
  $("j-h1").textContent="You’re in! 🎉";$("j-lead").textContent="Check this is your class, then start.";
  $("j-who").textContent=r.cls?(r.teacher||"Your teacher")+"’s class "+r.cls:"Your teacher’s class";
  $("j-title").textContent=r.title;
  let meta="Grade "+r.grade+" · Code "+r.code;
  if(r.due){const d=new Date(r.due+"T12:00:00");if(!isNaN(d))meta+=" · Due "+d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});}
  $("j-meta").textContent=meta;
  $("j-start").href=r.file+"?"+new URLSearchParams(r.offline&&r.cls?{c:r.code,k:r.cls}:{c:r.code}).toString();
  $("j-start").focus();
}
let lastCode="";
async function look(code){
  if(code.length!==6){msg("A class code has 6 letters and numbers, like K7Q2MX.","err");$("j-code").focus();return;}
  lastCode=code;$("j-help").hidden=true;
  $("j-go").disabled=true;msg("Finding your class…");
  try{
    const r=await getJSON(API+"?a=join&c="+code);
    if(!r.ok){msg(r.error==="closed"?"This class code is closed. Ask your teacher for a new one.":r.error==="busy"?"Lots of students are joining right now. Wait a moment and press Try again.":"We couldn’t find that code. Check it with your teacher and try again.","err");if(r.error==="busy")$("j-help").hidden=false;return;}
    show(r);
  }catch(e){
    // The server could not be reached. If the teacher's link says which worksheet it is, start it anyway:
    // the class is filled in, and answers are sent as soon as the connection works.
    const it=WS[qW];
    if(it&&code===clean(Q.get("c"))){show({code,cls:qK,title:it.code+" "+it.title,grade:it.grade,file:it.file,offline:true});
      msg("The school server is slow right now, but you can start. Your answers are sent to your teacher when the connection works.","");return;}
    msg((e&&e.message==="server"?"The school server had a problem answering.":"Could not reach the school server.")+" Press Try again. If it still doesn’t work, switch from school Wi-Fi to mobile data (or the other way round), or open the worksheet from the list.","err");
    $("j-help").hidden=false;
  }
  finally{$("j-go").disabled=false;}
}
$("j-retry").addEventListener("click",()=>look(lastCode||clean($("j-code").value)));
$("j-form").addEventListener("submit",e=>{e.preventDefault();look(clean($("j-code").value));});
$("j-back").addEventListener("click",()=>{$("j-found").hidden=true;$("j-help").hidden=true;msg("");$("j-form").hidden=false;$("j-h1").textContent="Join your class";$("j-lead").textContent="Type the code your teacher shows on the board, or scan their QR code.";$("j-code").value="";$("j-code").focus();history.replaceState(null,"","join.html");});
const c=clean(Q.get("c"));
if(c){$("j-code").value=c;look(c);}else $("j-code").focus();
})();
</script>
